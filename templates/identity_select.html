{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Your Identity - Asset Distribution</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="container" style="padding: 2rem 1rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1>Who are you?</h1>
            <p class="text-light">Select your name to continue</p>
        </div>
        
        <form method="post" action="{% url 'identity_select' %}">
            {% csrf_token %}
            
            {% for branch in branches %}
            <div class="branch-section">
                <h3 class="branch-header">{{ branch.name }}</h3>
                <div class="member-list">
                    {% for member in branch.members.all %}
                    <button type="submit" name="member_id" value="{{ member.id }}" 
                            class="member-btn {% if member.is_father %}father{% endif %}">
                        {{ member.name }}
                        {% if member.is_father %}
                        <span class="text-muted" style="font-size: 0.8em;">(Father)</span>
                        {% endif %}
                    </button>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
        </form>
        
        <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--color-border);">
            <a href="{% url 'logout' %}" class="text-muted">← Back to Login</a>
        </div>
    </div>
</body>
</html>
