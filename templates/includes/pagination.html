{% if assets.has_other_pages %}
<div class="pagination {{ extra_class }}">
    {% if assets.has_previous %}
    <a href="?page={{ assets.previous_page_number }}{% if selected_category %}&category={{ selected_category }}{% endif %}{% if selected_location %}&location={{ selected_location }}{% endif %}{% if search %}&search={{ search }}{% endif %}{% if status_filter %}&status={{ status_filter }}{% endif %}{% if per_page %}&per_page={{ per_page }}{% endif %}{% if current_sort %}&sort={{ current_sort }}&dir={{ current_dir }}{% endif %}">← Previous</a>
    {% endif %}

    <span class="current">
        Page
        <input type="number"
               class="page-input"
               value="{{ assets.number }}"
               min="1"
               max="{{ assets.paginator.num_pages }}"
               onkeydown="if(event.key==='Enter'){goToPage(this)}"
               onchange="goToPage(this)">
        of {{ assets.paginator.num_pages }}
    </span>

    {% if assets.has_next %}
    <a href="?page={{ assets.next_page_number }}{% if selected_category %}&category={{ selected_category }}{% endif %}{% if selected_location %}&location={{ selected_location }}{% endif %}{% if search %}&search={{ search }}{% endif %}{% if status_filter %}&status={{ status_filter }}{% endif %}{% if per_page %}&per_page={{ per_page }}{% endif %}{% if current_sort %}&sort={{ current_sort }}&dir={{ current_dir }}{% endif %}">Next →</a>
    {% endif %}
</div>
{% endif %}
