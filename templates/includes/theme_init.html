<script>
    (function () {
        try {
            var theme = localStorage.getItem('theme');
            if (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                theme = 'dark';
            }
            if (theme === 'dark') {
                document.documentElement.dataset.theme = 'dark';
            }
        } catch (error) {}
    })();
</script>
