{% load static %}
<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><title>Reset Password</title>
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head><body>
<div class="login-container"><div class="login-box">
<h1 class="login-title">Reset Password</h1>
<p class="login-subtitle">Enter your email and we'll send a reset link.</p>
<form method="post">{% csrf_token %}
{{ form.email.label_tag }}{{ form.email }}
{% if form.email.errors %}<div class="form-error">{{ form.email.errors.0 }}</div>{% endif %}
<button type="submit" class="btn btn-primary btn-block btn-lg mt-2">Send Reset Link</button>
</form>
<div style="text-align: center; margin-top: 1rem;"><a href="{% url 'login' %}" class="text-muted">Back to login</a></div>
</div></div>
</body></html>
